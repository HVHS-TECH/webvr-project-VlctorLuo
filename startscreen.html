<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>A-Frame Start Screen</title>
    <script src="https://aframe.io/releases/1.2.0/aframe.min.js"></script>
  </head>
  <body>
    <a-scene>
      <!-- Background (you can customize this with a color or an image) -->
      <a-sky color="#4CC3D9"></a-sky>
      
      <!-- Title Text -->
      <a-text value="Welcome to the Experience!" position="0 2 -3" color="white" font="https://aframe.io/examples/boilerplate/fonts/mozillavr.fnt"></a-text>
      
      <!-- Start Button (a clickable entity) -->
      <a-box 
        position="0 0 -3" 
        depth="0.5" 
        height="1" 
        width="2" 
        color="#ff6347" 
        class="start-button"
        event-set__mouseenter="scale: 1.2 1.2 1; color: #ff4500"
        event-set__mouseleave="scale: 1 1 1; color: #ff6347">
        <a-text value="Start" align="center" position="0 0 0.26" color="white" scale="2 2 2"></a-text>
      </a-box>

      <!-- Camera -->
      <a-camera position="0 1.6 0"></a-camera>

      <!-- Start Button Interaction -->
      <script>
        // Listen for click events on the start button
        const startButton = document.querySelector('.start-button');
        startButton.addEventListener('click', function() {
          // Transition to the main scene or action (for example, load a new scene)
          alert("Game Starting!");
          // Example: You can load a new scene here with: window.location.href = "game.html";
        });
      </script>
    </a-scene>
  </body>
</html>
