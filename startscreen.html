<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Start Screen</title>
    <script src="https://aframe.io/releases/1.2.0/aframe.min.js"></script>
  </head>
  <body>
    <a-scene>
      <!-- Background -->
      <a-sky color="#4CC3D9"></a-sky>

      <!-- Title Text -->
      <a-text value="Welcome to the Experience!" position="0 2 -3" color="white" font="https://aframe.io/examples/boilerplate/fonts/mozillavr.fnt"></a-text>

      <!-- Start Button (with hover effect) -->
      <a-box 
        position="0 0 -3" 
        depth="0.5" 
        height="1" 
        width="2" 
        color="#ff6347" 
        class="start-button"
        event-set__mouseenter="scale: 1.2 1.2 1; color: #ff4500"
        event-set__mouseleave="scale: 1 1 1; color: #ff6347">
        <a-text value="Start" align="center" position="0 0 0.26" color="white" scale="2 2 2"></a-text>
      </a-box>

      <!-- Camera -->
      <a-camera position="0 1.6 0" cursor="fuse: true; fuseTimeout: 500;"></a-camera>

      <!-- Button Interaction -->
      <script>
        // Select the start button using its class
        const startButton = document.querySelector('.start-button');

        // Add event listener for the click event
        startButton.addEventListener('click', function () {
          // Redirect to the game page (index.html)
          window.location.href = 'index.html';  // This redirects to your game
        });
      </script>
    </a-scene>
  </body>
</html>
